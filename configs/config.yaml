seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  dataset_name: "assistments09"   # skill-builder 2009-2010
  min_interactions_per_student: 10
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

bkt:
  # per-skill parameters; fit is a coarse grid search (see src/models/bkt.py)
  init_p_know: 0.4
  init_p_learn: 0.2
  init_p_guess: 0.25
  init_p_slip: 0.1
  min_students_per_skill: 5
  min_obs_per_skill: 20

dkt:
  embedding_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.2
  batch_size: 64
  max_seq_len: 200
  lr: 0.001
  epochs: 20
  early_stopping_patience: 3

policy:
  actions: ["explain", "worked_example", "socratic_hint", "easier_problem", "harder_problem", "prerequisite_review"]
  rule_thresholds:
    low_mastery: 0.4
    high_mastery: 0.7
  bandit:
    type: "epsilon_greedy"   # or "linucb"
    epsilon: 0.1
    alpha: 1.0                # LinUCB exploration coefficient
    context_dim: 8            # mastery, recent_acc, difficulty, attempts, improvement, ...

simulator:
  n_students: 500
  n_interactions_per_student: 50
  n_seeds: 5                  # independent simulated populations for mean±std
  heterogeneous: false        # if true: latent learner types z_i (hidden from policy)
  delayed_effects: false      # M6: Independence/Fatigue latents (hidden from policy)

rl:
  horizon: 50
  num_skills: 123
  observation_mode: "oracle"  # diagnostic upper bound; estimated is deployable
  reward: "mastery_gain"      # mastery_(t+1) - mastery_t; no hint/action costs
  gamma: 0.99                 # Phase 3 must ablate discount sensitivity
  delayed_effects: true
  heterogeneous: false

dqn:
  train_episodes: 2000
  hidden_dims: [128, 128]
  learning_rate: 0.0005
  batch_size: 128
  replay_capacity: 100000
  min_replay_size: 2000
  target_sync_steps: 500
  train_frequency: 4
  gradient_clip: 10.0
  reward_scale: 100.0
  double_dqn: false
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 60000
  validation_interval: 100
  validation_episodes: 100
  heldout_eval_episodes: 500
  train_seed_start: 10000
  validation_seed_start: 100000
  heldout_seed_start: 200000
  torch_num_threads: 1

llm:
  provider: "anthropic"        # placeholder — fill in during Day 11-12
  model: "claude-sonnet-4-6"
  languages: ["en", "ar"]

paths:
  results_dir: "results"
  checkpoints_dir: "results/checkpoints"
